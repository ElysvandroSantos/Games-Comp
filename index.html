<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cruzadinha de Arquitetura Computacional</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Cruzadinha de Arquitetura Computacional</h1>
      <div class="status-bar">
        <div class="status-item">
          <span class="status-label">Nível</span>
          <span id="level-display" class="status-value">1</span>
          <span id="difficulty-display" class="status-value difficulty-badge">Fácil</span>
        </div>
        <div class="status-item">
          <span class="status-label">Tempo</span>
          <span id="timer-display" class="status-value">30:00</span>
        </div>
        <div class="status-item">
          <span class="status-label">Acertos</span>
          <span id="score-display" class="status-value">0 de 8</span>
        </div>
      </div>
    </header>

    <div class="game-area">
      <div class="controls">
        <button id="start-btn" class="btn btn-primary">Iniciar Cruzadinha</button>
        <button id="restart-btn" class="btn btn-secondary" style="display: none;">Reiniciar Nível</button>
      </div>

      <div class="crossword-wrapper">
        <div id="crossword" class="crossword"></div>
      </div>

      <div class="clues-panel">
        <div class="clue-group">
          <h3>Horizontais</h3>
          <ul id="clues-across" class="clue-list"></ul>
        </div>
        <div class="clue-group">
          <h3>Verticais</h3>
          <ul id="clues-down" class="clue-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Popup Game Over -->
  <div id="gameover-popup" class="popup hidden">
    <div class="popup-content">
      <h2>Game Over</h2>
      <p id="gameover-message">O tempo esgotou! A cruzadinha não foi finalizada.</p>
      <button id="gameover-retry" class="btn btn-primary">Tentar novamente este nível</button>
    </div>
  </div>

  <!-- Popup Level Complete -->
  <div id="levelcomplete-popup" class="popup hidden">
    <div class="popup-content">
      <h2>Nível Concluído!</h2>
      <p id="levelcomplete-message">Parabéns! Você completou o nível.</p>
      <div id="levelcomplete-stats" class="stats"></div>
      <button id="levelcomplete-next" class="btn btn-primary">Próximo Nível</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
